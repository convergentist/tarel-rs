[package]
name = "datasets-stats"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Descriptive statistics over the raw/ orderbook + trades parquet datasets (TAReL / NeurIPS 2026)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "datasets-stats"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = "57.3.1"
parquet = "57.3.1"

[lints.rust]
unsafe_code = "forbid"
unused_variables = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
