[package]
name = "tarel-rs"
version = "0.0.10"
edition = "2024"
rust-version = "1.85.0"
description = "Orchestration + bridge driver for the HFT-RP-WGAN pipeline"
license = "Apache-2.0"
publish = false

[[bin]]
name = "tarel"
path = "src/main.rs"

[lib]
name = "tarel"
path = "src/lib.rs"

[dependencies]
# Library crates from sibling workspaces.
takens_rp = { path = "../../../takens-rs/takens-rp", features = ["parquet"] }
takens_stats = { path = "../../../takens-rs/takens-stats" }
logan-rs = { path = "../../../logan-rs" }
tch = { version = "0.22" }

# Orchestration plumbing.
anyhow = { version = "1" }
clap = { version = "4", features = ["derive"] }
ndarray = { version = "0.16" }
rmp-serde = { version = "1.3" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = { version = "0.10" }
thiserror = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_variables = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
