# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — TAReL stand-alone Stage-1 → Stage-2 demo.
#
# What this orchestrates:
#   stage-one  builds the m4-stage-one image (debian-slim + python:3.12 +
#              rust 1.85 + torch 2.5.1 CPU + cargo build --release), then
#              runs `tarel run-stage-one --produce-dp-rp` against the
#              kraken:BTC-USDC parquet that ships in datasets/consolidated/.
#              Outputs land in ./artifacts/runs (bind-mounted from host).
#
#   stage-two  builds the m4-stage-two image on top of stage-one's image
#              (via `additional_contexts.stage_one_image: service:stage-one`),
#              waits for stage-one to exit 0, then runs
#              `tarel run-stage-two` over the run directory stage-one wrote.
#
# Run the demo:
#   docker compose up --build
#     - builds stage-one (~10-20 min cold, mostly cargo build)
#     - builds stage-two (seconds; only adds a 1-line entrypoint layer)
#     - runs stage-one to completion
#     - runs stage-two to completion
#     - both containers exit; the run directory remains in ./artifacts/runs
#
# Run just one stage:
#   docker compose run --rm stage-one
#   docker compose run --rm stage-two   # assumes ./artifacts/runs is populated
#
# Override defaults without editing this file:
#   Create a .env file next to this docker-compose.yml, e.g.
#       CELL=kraken:BTC-USDC
#       SEED=2
#       EXP=0xA0000001          # shared by stage-one and stage-two (same run id)
#       RUN_MINS=10
#       CLOCKS=event
#       SEEDS_COUNT=2
#   docker-compose picks them up via the ${VAR:-default} syntax below.
#
# Platform note:
#   Pinned to linux/arm64 (Apple Silicon). On x86_64 hosts you'll need
#   QEMU emulation (slow) or a separate CUDA-capable compose file.
# ──────────────────────────────────────────────────────────────────────────────

# Compose Specification — no top-level `version:` key needed.

services:

  stage-one:
    image: ${STG_ONE_IMAGE:-tarel-rs:-m4-stage-one}
    build:
      context: .
      dockerfile: ${STG_ONE_DOCKER_FILE:-m4-stage-one.Dockerfile}
      platforms:
        - ${STG_ONE_PLATFORM:-linux/arm64}
    platform: ${STG_ONE_PLATFORM:-linux/arm64}
    environment:
      # Stage-1 inputs (defaults match the kraken parquet that ships in
      # datasets/consolidated/). Override via .env or `-e VAR=...`.
      CELL: ${CELL:-kraken:BTC-USDC}
      INPUT_PARQUET: ${INPUT_PARQUET:-/work/tarel/datasets/consolidated/kraken/BTC-USDC.parquet}
      OUTPUT_RUNS: /work/tarel/artifacts/runs
      STG_ONE_EXP: ${STG_ONE_EXP:-0xA0000003}
      STG_ONE_SEED: ${STG_ONE_SEED:-2}
    volumes:
      # Read-only mount of the on-disk parquet store. The container only
      # needs to read; preventing writes catches accidental dataset
      # corruption from inside the image.
      - ./datasets:/work/tarel/datasets:ro
      # Shared run output directory. stage-one writes here; stage-two reads
      # + writes here. Survives the container lifecycle so you can inspect
      # buckets / DPs / RPs / PNG grids on the host after the demo.
      - ./artifacts/runs:/work/tarel/artifacts/runs

  stage-two:
    image: ${STG_TWO_IMAGE:-tarel-rs:m4-stage-two}
    build:
      context: .
      dockerfile: ${STG_TWO_DOCKER_FILE:-m4-stage-two.Dockerfile}
      platforms:
        - ${STG_TWO_PLATFORM:-linux/arm64}
      # `stage_one_image` is the named build context the stage-two
      # Dockerfile references via `FROM stage_one_image`. Pointing it at
      # `service:stage-one` makes compose build stage-one first and reuse
      # that image, so we don't rebuild cargo/torch twice.
      additional_contexts:
        stage_one_image: service:stage-one
    platform: ${STG_TWO_PLATFORM:-linux/arm64}
    depends_on:
      stage-one:
        # Block stage-two until stage-one exits 0. If stage-one fails,
        # stage-two never starts (which is what we want — stage-two needs
        # the run directory stage-one produces).
        condition: service_completed_successfully
    environment:
      CELL: ${CELL:-kraken:BTC-USDC}
      # Number of seeds to train (pilot=3, production=20).
      STG_TWO_SEED: ${STG_TWO_SEED:-2}
      # Wallclock budget per (cell, seed) in minutes.
      STG_TWO_RUN_MINS: ${STG_TWO_RUN_MINS:-15}
      OUTPUT_RUNS: /work/tarel/artifacts/runs
      STG_TWO_EXP: ${STG_TWO_EXP:-0xA0000003}
      STG_TWO_CLOCKS: ${STG_TWO_CLOCKS:-physical}
    volumes:
      - ./datasets:/work/tarel/datasets:ro
      - ./artifacts/runs:/work/tarel/artifacts/runs
